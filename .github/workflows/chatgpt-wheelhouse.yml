name: ChatGPT wheelhouse

on:
  push:
    branches:
      - tmp/chatgpt-sqlite-failover-export

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: -r requirements.txt -d wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: teledrive-wheelhouse-py313-linux
          path: wheelhouse
          if-no-files-found: error
