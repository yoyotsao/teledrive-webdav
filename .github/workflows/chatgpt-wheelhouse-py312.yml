name: ChatGPT py312 wheelhouse

on:
  push:
    branches:
      - tmp/chatgpt-sqlite-failover-export
    paths:
      - .github/workflows/chatgpt-wheelhouse-py312.yml

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel -r requirements.txt pytest -w wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: teledrive-wheelhouse-py312-linux
          path: wheelhouse
          if-no-files-found: error
