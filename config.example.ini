; Copy to config.ini and fill in. config.ini is gitignored — it holds credentials.
;
; Any value left empty falls back to an environment variable, and finally to
; env_file below. That way the TeleDrive repo's .env can stay the single source
; of truth for credentials and nothing secret is ever duplicated here.

[telegram]
; From my.telegram.org. Empty -> env TELEGRAM_API_ID / TELEGRAM_API_HASH.
api_id =
api_hash =
; Telegram user ID of the account used for backend authentication.
primary_user_id =
; Existing directory outside this application. Direct child <user_id>.session
; files are the complete account registry. SQLite sessions are unencrypted bearer
; credentials; protect this directory and never commit or share its contents.
session_dir =
; Per-account concurrent whole-file uploads and chunk upload requests.
upload_files = 3
; How many MTProto connections to read bytes over.
download_connections = 8
; Max SaveBigFilePart requests in flight at once for large uploads.
upload_parts = 12

[upload]
; Pipeline worker counts and Web-compatible album/message limits.
hash_concurrency = 2
hash_check_concurrency = 8
register_concurrency = 8
album_batch = 10
album_timeout_seconds = 60
; A plain file written outside /game is uploaded once its PUT has finished and
; no further write has arrived for this many seconds. /game has its own,
; much longer window (debounce_minutes below) because a folder is packed whole.
debounce_seconds = 10
message_rate = 3
message_burst = 6
; Empty lets later thumbnail support discover FFMPEG or ffmpeg on PATH.
ffmpeg =

[teledrive]
; TeleDrive backend base URL. "/api/v1" is appended automatically.
base_url = https://teledrive.yoyotsaoteledrive.dpdns.org
; Root folder name that /game maps to. Created on first upload if missing.
game_folder = game
; Directory-listing cache lifetime in seconds. Keep it at or below rclone's
; --dir-cache-time; the bridge is the second cache layer.
dir_cache_seconds = 3600

[reina]
; ReinaManager Web Origin，必須精確比對，不能使用萬用字元。
allowed_origin = https://teledrive.yoyotsaoteledrive.dpdns.org
; Reina Server URL，供後續遊戲控制流程使用。
server_url = https://teledrive.yoyotsaoteledrive.dpdns.org
; Locale Emulator 執行檔路徑，留空表示停用。
locale_emulator =

[bridge]
; Loopback only — never bind a public interface, there is no authentication.
host = 127.0.0.1
port = 8081
; Drive letter rclone mounts the bridge on. Used to translate the Windows path
; the Explorer verb hands us back into a WebDAV path. start.bat no longer has its own copy.
mount_drive = H:
; Bridge mounts the drive itself once it is serving (rclone on PATH). false = mount by hand.
auto_mount = true
log_level = INFO

[paths]
; One root holds everything this tool writes. The layout inside is the program's
; business, not a setting — four separate paths only invited them to drift apart:
;
;   meta/     previews and metadata. Safe to delete: costs a re-warm, not data.
;   rclone/   rclone's VFS cache. Safe to delete: costs a re-download.
;   local/    files fetched with "save to local". NOT a cache — deleting loses them.
;   staging/  /game trees waiting to be packed and uploaded.
;   uploads/  plain writes anywhere else, waiting to be uploaded and registered.
cache_dir = data

[game]
; A /game/<folder> subtree with no writes for this long is considered finished,
; then it gets packed (ZIP_STORED) and uploaded. Applies to /game only; plain
; files elsewhere use [upload] debounce_seconds.
debounce_minutes = 5
; A .rar dropped into /game is extracted with 7-Zip and re-packed as a stored
; zip, the only archive the drive can browse. Empty -> C:\Program Files\7-Zip\7z.exe
seven_zip =

[warmup]
; The bridge walks the whole tree in the background and fills the preview and
; dimension caches, so a folder is never opened cold. It only works in the gaps
; between real requests, so browsing stays first in line. Turn it off to fetch
; previews only for folders actually visited (and run warmup.py by hand).
auto = true
; How long after finishing one pass before walking the tree again. A pass over
; an already-warm tree costs one listing per folder and nothing from Telegram;
; its only job is to notice files uploaded from the web UI since.
interval_minutes = 360
; RARs found in /game are downloaded, converted to a stored zip (see [game]
; seven_zip) and, once the zip reads back, the original moves to the trash.
convert_rar = true

[env]
; Optional .env file to source credentials from (KEY=VALUE per line).
; Points at the TeleDrive repo by default so credentials live in exactly one place.
env_file = D:\python\teledrive\.env
