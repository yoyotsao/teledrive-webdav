; Copy to config.ini and fill in. config.ini is gitignored — it holds credentials.
;
; Any value left empty falls back to an environment variable, and finally to
; env_file below. That way the TeleDrive repo's .env can stay the single source
; of truth for credentials and nothing secret is ever duplicated here.

[telegram]
; From my.telegram.org. Empty -> env TELEGRAM_API_ID / TELEGRAM_API_HASH.
api_id =
api_hash =
; Telethon StringSession from TeleDrive's generate_session.py.
; Empty -> env TELEGRAM_SESSION_STRING.
; The same string is used twice: MTProto direct connection *and* POST /auth/login
; (the backend accepts Telethon StringSessions as of TeleDrive commit a5f21ad).
session =
; How many MTProto connections to read bytes over. Measured here, 8 connections
; beat 1 by 1.72x; 16 or more start drawing "Server closed the connection" from
; Telegram, so raise this only if you can show it helps on your link. Throughput
; also depends on cryptg being installed (see requirements.txt) — without it the
; pure-Python AES ceiling dominates and this knob barely matters.
download_connections = 8

[teledrive]
; TeleDrive backend base URL. "/api/v1" is appended automatically.
base_url = https://teledrive.yoyotsaoteledrive.dpdns.org
; Root folder name that /game maps to. Created on first upload if missing.
game_folder = game
; Directory-listing cache lifetime in seconds. Keep it at or below rclone's
; --dir-cache-time; the bridge is the second cache layer.
dir_cache_seconds = 60

[bridge]
; Loopback only — never bind a public interface, there is no authentication.
host = 127.0.0.1
port = 8081
; Drive letter rclone mounts the bridge on. Used to translate the Windows path
; the Explorer verb hands us back into a WebDAV path. Must match MOUNT in start.bat.
mount_drive = H:
log_level = INFO

[paths]
; One root holds everything this tool writes. The layout inside is the program's
; business, not a setting — four separate paths only invited them to drift apart:
;
;   meta/     previews and metadata. Safe to delete: costs a re-warm, not data.
;   rclone/   rclone's VFS cache. Safe to delete: costs a re-download.
;   local/    files fetched with "save to local". NOT a cache — deleting loses them.
;   staging/  /game trees waiting to be packed and uploaded.
cache_dir = data

[game]
; A /game/<folder> subtree with no writes for this long is considered finished,
; then it gets packed (ZIP_STORED) and uploaded.
debounce_minutes = 5

[env]
; Optional .env file to source credentials from (KEY=VALUE per line).
; Points at the TeleDrive repo by default so credentials live in exactly one place.
env_file = D:\python\teledrive\.env
